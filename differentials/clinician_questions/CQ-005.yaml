id: CQ-005
question: Can high-sensitivity peripheral-blood KIT D816V testing be performed with
  specimen, method, and limit of detection documented?
rationale: Prior KIT-negative report lacks method/LOD; consensus mast-cell diagnostic
  pathways require sensitive KIT D816V methods. Negative results without documented
  assay quality do not fully exclude low-burden disease. (HαT explains basal tryptase
  separately and is not a substitute citation for KIT methodology.)
