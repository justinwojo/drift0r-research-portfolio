summary: Preferred multi-disease research architecture from Round-1 synthesis — a
  research organizing frame, not a single causal mechanism and not a diagnosis. Infection
  limb detachable pending adjudication. Does not by itself explain tryptase/HαT (CLM-0030/0031),
  Babesia FISH×2 (CLM-0036), or historical profound hypogonadism (CLM-0018). Supporting
  cards are domain or methodological anchors (densitometry reporting, thiamine biomarkers,
  humoral abnormality), not proof of a layered multi-disease etiology. Models can agree
  on errors; architecture confidence is medium pending further adjudication.
