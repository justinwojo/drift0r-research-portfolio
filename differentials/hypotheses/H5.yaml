summary: IgG1-low / IgG4-high lab pattern is real and polyclonal. Named specific antibody
  deficiency remains low confidence until same-lab pre/post polysaccharide vaccine
  challenge and infection history. lit-0206 (Lawrence & Borish 2022) is a diagnostic-pitfalls
  review cautioning against overcalling SAD from titers alone — filed under contradicting
  literature, not support. Not classic IgG4-RD — lit-0089 and lit-0096 support
  that non-classic / elevation-without-RD framing (catalog polarity supports H5's
  position) rather than contradicting it.
