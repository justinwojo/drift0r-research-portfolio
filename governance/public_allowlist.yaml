  external_patient_hosted_folder: "https://drive.google.com/drive/folders/1z_juK9yVdhbzaGJafzzZYZWe3U1cs37e"
  external_folder_notes: >
    A Google Drive folder is publicly/anonymously accessible under Drift0r's external control.
    Drift0r granted broad publish permission for this research portfolio; the owner continues
