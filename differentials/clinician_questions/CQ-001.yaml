id: CQ-001
question: Would paired bone formation markers (P1NP, bone-specific ALP ± osteocalcin),
  interpreted with preanalytical standards, help classify turnover before any long-term
  bone-agent class discussion?
rationale: Formation markers are not documented in the public ledger; CTX alone (upper-normal,
  fasting unknown) cannot establish formation–resorption uncoupling. BTM use for monitoring/interpretation
  and sex-specific reference intervals are the relevant literature (not densitometry-only
  guidance).
