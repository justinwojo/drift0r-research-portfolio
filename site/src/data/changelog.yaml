      - "Psychiatric entry no longer asserts the question closed: the evaluation history other than the MMPI-2-RF is patient-reported, the record supports reversal of the SSD label specifically, and treating the medical findings as primary is a research position not a clinical adjudication (CLM-0046, CLM-0047, CLM-0048)"
