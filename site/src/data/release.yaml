    verbatim clinical wording" limit): historical material drawn from the documents Drift0r himself
    provided or published — including numeric values, dosing history and mental-health content — may
    be published as attributed historical record. Material not traceable to those documents remains
    outside the grant, and no content may recommend that a reader take, start, stop or adjust
    anything (03_public_language_guide.md 4.5).
    Search indexing is enabled (DEC-0037). DEC-0023 treated removal of noindex as a patient decision
    separate from this grant; the owner judges the broad grant to cover it, and DEC-0037 records that
    as owner editorial judgment rather than a documented patient statement about indexing specifically.
