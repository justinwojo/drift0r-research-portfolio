summary: Best single-primary research alternative (WNT1/LRP5/PLS3/mild OI spectrum;
  HPP low unless ALP truly low). Gene panel not performed. Related-cohort pathogenic
  yield is modest; panels can return variants of uncertain significance that complicate
  interpretation; negative panel does not close unknown genes or multi-hit secondary OP.
  No dedicated contradicting literature card is filed — the empty contradicting_literature_ids
  list reflects missing formal counters, not absence of caveats; the related-cohort
  modest yield and VUS/interpretation difficulty already named here are the primary
  counter-considerations.
