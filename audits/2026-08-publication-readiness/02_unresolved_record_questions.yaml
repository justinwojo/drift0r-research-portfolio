questions:
  - id: UQ-0001
    topic: KIT assay method
    question: >
      What was the exact KIT assay for the reported negative result — specimen type,
      method (ASO-qPCR, ddPCR, NGS, other), laboratory, and limit of detection?
    why_it_matters: >
      Low-burden systemic mastocytosis exclusion depends on assay sensitivity;
      "KIT negative" without method is incomplete for public certainty language.
    related_claims: [CLM-0032, CLM-0057, CLM-0065]
    related_corrections: [COR-0005]
    closest_available_record: >
      Narrative statements of KIT-negative in thiamine summary, medical-psychological
      history PDF, evidence pack, ledger T036 — no method sheet.
    status: open
    owner: patient_or_clinician_records
    blocks_launch_critical_wording: true
  - id: UQ-0002
    topic: CTX pre-analytical conditions
    question: >
      Was serum CTX 616 pg/mL (2026-06-26) drawn fasting, at a standardized morning time,
      and on which assay platform?
    why_it_matters: CTX is sensitive to food intake and diurnal variation; affects turnover interpretation.
    related_claims: [CLM-0010]
    related_corrections: [COR-0006]
    closest_available_record: Bone density summary turnover table — value and ref only.
    status: open
    owner: patient_or_lab_records
    blocks_launch_critical_wording: false

  - id: UQ-0003
