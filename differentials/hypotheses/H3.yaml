summary: Ongoing calcium-flux research module (serial 24h urine Ca 283→254→333 mg/24h
  in a male; common male threshold often 300 mg/day or 4 mg/kg — 2 of 3 collections
  below 300; middle value 254 normal at performing lab ref 100–300 vs Litholink 40–250)
  plus high urine Na and missing formation markers; module not unifier. CTX alone
  upper-normal without paired P1NP/BSAP does not prove uncoupling. Cited IH literature
  (lit-0152/lit-0153) describes mild BMD reduction and rate-of-loss association in
  stone formers — it does not account for spine T −4.3 magnitude. On stone status the
  record says two things and both belong here. The CT urogram of 2026-02-27 found no
  stones, and the urology summary records one lifetime stone, passed spontaneously in
  his late twenties after about a week of heavy energy-drink and fast-food intake. So
  this is a stone-forming history at its mildest end, not an absence of one, and the
  stone-former literature applies weakly rather than not at all. Three contradicting
  cards are now filed (lit-0337, lit-0338, lit-0339) covering whether urinary calcium
  tracks bone-density severity at all and whether stone-related fracture excess is
  site-selective. The last of those counts fractures rather than measuring bone density,
  so it bears on this module only through a specific step, stated here rather than left
  to be inferred — the excess it reports is confined to the spine, while the low
  readings in this record appear at spine, hip and forearm at once, which is more than a
  stone-and-calcium mechanism has been shown to produce. Magnitude mismatch and incomplete
  mechanism classification remain the other named counters.
