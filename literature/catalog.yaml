    rules used here: Z-scores preferred in males <50; osteoporosis not diagnosed by
    BMD alone under age 50; each DXA facility should determine its precision error
    and calculate the LSC (manufacturer LSC not a substitute); TBS is appropriate
    in adults aged ≥40 years (male fracture-risk evidence primarily studied above
    age 50); VFA has formal indication criteria — low BMD/young age alone is not a
    VFA indication without other triggers.'
