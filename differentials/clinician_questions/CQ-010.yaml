id: CQ-010
question: Can original hypogonadism-era HPG laboratory reports (around historical
  T≈34) be reconstructed, and is karyotype/CMA appropriate when clinically indicated?
rationale: Historical T≈34 is reported_history with incomplete instrument provenance;
  Endocrine Society hypogonadism guidance informs HPG-axis reconstruction. Karyotype/CMA
  is a separate cytogenetic indication question (e.g., Klinefelter workup pathways),
  not established by testosterone-therapy guidelines alone.
