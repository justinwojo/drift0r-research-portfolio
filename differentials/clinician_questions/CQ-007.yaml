id: CQ-007
question: Should serum copper, ceruloplasmin, and zinc be measured as a don’t-miss
  screen for copper-deficiency myeloneuropathy (which can lack cytopenias)?
rationale: Copper not documented in public pack; copper-deficiency myeloneuropathy
  can present with neurologic findings and may lack frank cytopenias. Zinc excess
  is a risk context. Wilson disease (copper overload) is a different problem and is
  not the citation basis here.
