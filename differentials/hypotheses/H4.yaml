summary: Detachable residual contributor hypothesis for periosteal/nodule signals
  and contested specialty serology. Specialty IgM contested; PCR/FISH negative. Not
  commercially confirmed. Support is limited to applicability-limited musculoskeletal/osseous
  Bartonella case literature, not serology alone. Does not explain magnitude of generalized
  low BMD, historical hypogonadism, or hypercalciuria. Patient-reported improvement
  on atovaquone + clindamycin (± azithromycin) (CLM-0039) is a Babesia-directed regimen
  and is not organism-specific evidence for Bartonella — not listed as explained by H4.
