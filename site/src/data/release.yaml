  scope: >-
    Broad permission to publish the research project and its analysis in a public GitHub repository
    and hosted website, including case-related material, identity/handle, sensitive subject areas
    (including the exact v0.1 mental-health claims CLM-0046/0047/0048 under DEC-0030),
