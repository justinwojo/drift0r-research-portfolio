    question: >
      Can original laboratory reports for total testosterone ≈34 ng/dL (reportedly ×2)
      be retrieved with dates, assay methods, and concurrent LH, FSH, prolactin, estradiol, SHBG?
    why_it_matters: >
      Distinguishes reported history from instrument-verified values; informs central vs
      primary hypogonadism and Klinefelter pretest probability.
    related_claims: [CLM-0018]
    related_corrections: [COR-0004]
    closest_available_record: >
      Narrative ~34 ng/dL in endocrine/thiamine/ID summaries; tabulated HPG from 2021 onward.
    status: open
    owner: patient_or_clinic_archives
    blocks_launch_critical_wording: true

